<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Book Alchemy{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('home') }}">BA<span>Book Alchemy</span></a><nav aria-label="Hauptnavigation"><a href="{{ url_for('home') }}">Bibliothek</a><a href="{{ url_for('add_author') }}">Autor hinzufügen</a><a href="{{ url_for('add_book') }}">Buch hinzufügen</a><a href="{{ url_for('recommendations') }}">Entdecken</a></nav></header><main>{% for category, message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}" role="status">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Book Alchemy · Deine Geschichten, an einem Ort.</footer></body></html>
