{% extends 'base.html' %}{% block title %}Buch hinzufügen · Book Alchemy{% endblock %}{% block content %}<div class="form-panel"><p class="eyebrow">PLATZ FÜR EIN NEUES KAPITEL</p><h1>Buch hinzufügen</h1>{% if authors %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Titel<input name="title" required maxlength="300" value="{{ request.form.get('title','') }}"></label><label>ISBN<input name="isbn" required maxlength="30" value="{{ request.form.get('isbn','') }}"><small>ISBN-10 oder ISBN-13, mit oder ohne Bindestriche.</small></label><label>Erscheinungsjahr<input name="publication_year" type="number" min="1" max="9999" required value="{{ request.form.get('publication_year','') }}"></label><label>Autor<select name="author_id" required><option value="">Autor auswählen</option>{% for author in authors %}<option value="{{ author.id }}" {% if request.form.get('author_id') == author.id|string %}selected{% endif %}>{{ author.name }}</option>{% endfor %}</select></label><button>Buch speichern</button></form>{% else %}<p>Bitte zuerst einen Autor hinzufügen.</p><a class="button" href="{{ url_for('add_author') }}">Autor hinzufügen</a>{% endif %}</div>{% endblock %}
